name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # fmt-check calls `cargo +nightly fmt`. Install nightly first so the
      # following stable install stays the default toolchain.
      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: extractions/setup-just@v4

      - uses: Swatinem/rust-cache@v2

      - run: just lint
      - run: just clippy
      - run: just doc-check
      - run: just test
